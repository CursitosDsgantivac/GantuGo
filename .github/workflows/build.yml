name: Build MCP Server Binaries

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Windows builds
          - os: windows-latest
            goos: windows
            goarch: amd64
            output: gantuProgram.exe
            artifact: gantuProgram-windows-amd64.exe

          # Linux builds
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            output: gantuProgram
            artifact: gantuProgram-linux-amd64

          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            output: gantuProgram
            artifact: gantuProgram-linux-arm64

          # macOS builds
          - os: macos-latest
            goos: darwin
            goarch: amd64
            output: gantuProgram
            artifact: gantuProgram-darwin-amd64

          - os: macos-latest
            goos: darwin
            goarch: arm64
            output: gantuProgram
            artifact: gantuProgram-darwin-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -o ${{ matrix.output }} -ldflags="-s -w" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          retention-days: 90

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
